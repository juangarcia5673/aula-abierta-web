<svg xmlns="http://www.w3.org/2000/svg" width="620" height="500" viewBox="0 0 620 500" role="img" aria-labelledby="title desc">
  <title id="title">Un laboratorio de ideas</title>
  <desc id="desc">Ilustración vectorial de estudiantes colaborando con una computadora, notas y gráficos.</desc>
  <defs>
