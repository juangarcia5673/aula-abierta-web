    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263C59"/><stop offset="1" stop-color="#16263F"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#16263F" opacity=".24"/></pattern>
  </defs>
  <rect width="620" height="500" rx="28" fill="url(#bg)"/>
  <rect x="18" y="18" width="584" height="464" rx="22" fill="url(#dots)"/>
  <circle cx="492" cy="105" r="64" fill="#DDF77B"/>
  <circle cx="108" cy="382" r="45" fill="#F4B49A"/>
